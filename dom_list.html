    </ul>

  <header class="sub-hero">
    <h1>댓글 추가/삭제</h1>
    <p>DOM 요소를 동적으로 생성하고 삭제하는 실습 페이지입니다.</p>
  </header>

  <main class="container">
    <section class="card lab-panel">
      <h2>실습 2: 댓글 추가/삭제 프로그램</h2>
      <p class="section-desc"><a class="text-link" href="practice.html">← 실습 목록으로 돌아가기</a></p>
      <p>버튼을 누르면 prompt로 댓글을 입력받아 목록에 추가하고, 댓글을 클릭하면 해당 항목이 삭제됩니다.</p>
      <button class="primary-btn" onclick="addComment()" type="button">+ 댓글 추가하기</button>
      <ul id="commentList" class="comment-list"></ul>
    </section>
  </main>

  <script>
    function addComment() {
      var inputStr = prompt("추가할 댓글 내용을 입력하세요:", "오늘 수업 너무 재밌어요!");
      if (inputStr == null || inputStr.trim() == "") {
        return;
      }

      var parent = document.getElementById("commentList");
      var newLi = document.createElement("li");
      newLi.textContent = inputStr;
      newLi.onclick = function () {
        var p = this.parentElement;
        p.removeChild(this);
      };
      parent.appendChild(newLi);
    }

    window.addEventListener("load", function () {
      addComment();
    });
  </script>

</html>
